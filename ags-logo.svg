<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="darkgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Decorative left line -->
  <rect x="0" y="38" width="18" height="1.5" fill="url(#gold)" rx="1"/>

  <!-- Diamond gem icon -->
  <polygon points="32,14 44,14 50,26 32,46 14,26 20,14" fill="url(#gold)" opacity="0.15"/>
  <polygon points="32,18 42,18 47,27 32,42 17,27 22,18" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
  <polygon points="32,24 38,24 41,29 32,38 23,29 26,24" fill="url(#gold)" opacity="0.5"/>

  <!-- AGS Text -->
  <text x="60" y="47" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="url(#gold)" letter-spacing="6">AGS</text>

  <!-- Tagline -->
  <text x="62" y="63" font-family="Georgia, serif" font-size="8.5" fill="#C9A227" letter-spacing="4" opacity="0.85">LUXURY GIFTING</text>

  <!-- Decorative right line -->
  <rect x="218" y="38" width="22" height="1.5" fill="url(#gold)" rx="1"/>
</svg>
